name: macOS checks
on: [push, pull_request]
concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate source, tests, and app bundle
        run: bash scripts/check.sh
